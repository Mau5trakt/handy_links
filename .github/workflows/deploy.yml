name: Deploy Application

on:
  push:
    branches:
      - master

jobs:
  deploy:
    name: Deploy to Production
    environment: ovh-deploy
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Configurar SSH
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      # Paso 2: Ejecutar todos los comandos en el servidor remoto
      - name: Execute Remote Deployment
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
          # 1. Navegar al directorio del proyecto
          cd /home/ubuntu/handy_links
          
          # 2. Actualizar código
          git fetch origin
          git reset --hard origin/master
          
          pyenv activate links
          
          
          pip install -r /home/ubuntu/handy_links/requirements.txt
          
          # 5. Ejecutar comandos Django
          python manage.py migrate
          python manage.py collectstatic --no-input
          
          # 6. Reiniciar servicios
          sudo supervisorctl restart all
          EOF