name: Deploy Django to VPS

on:
  push:
    branches: [ "master" ]

jobs:
  deploy:
    environment: ovh-deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{secrets.SSH_PRIVATE_KEY}}


      - name: Execute deploy script
        run: |
          ssh -o StrictHostKeyChecking=no -o User=deploy ${{ secrets.SSH_HOST }} "
          cd ${{ secrets.PROJECT_PATH }} && \
          git pull origin master && \
          /home/deploy/.pyenv/versions/links/bin/python -m pip install -r requirements.txt && \
          /home/deploy/.pyenv/versions/links/bin/python manage.py migrate && \
          /home/deploy/.pyenv/versions/links/bin/python manage.py collectstatic --noinput && \
          sudo supervisorctl restart handy_links
          "