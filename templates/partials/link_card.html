{% load static %}

<div class="link-card" data-link_id="{{link.id}}" data-folder_uuid="{{ link.folder.id }}">
    <div class="link-card__header">
        <img src="{{ link.owner.get_avatar }}" alt="{{link.owner}}'s avatar" class="link-card__header-img">
        <span class="link-card__header-owner">{% if link.owner == request.user %} You {% else %} {{link.owner}} {% endif %}</span>
    </div>
    <div class="link-card__body">
        <a class="link-card__body-link" href="{{link.url}}" target="_blank" title="{{link.description}}" id="linkUrl">{{ link.url }}</a>
        <p class="link-card__body-description" id="linkDescription">{{link.description}}</p>
    </div>
    <div class="link-card__footer">
        <img src="{% static 'media/img/clip-attach-svgrepo-com.svg' %}" alt="clip icon" title="Copy to clipboard" id="copyLink">
        {% if request.user == link.owner or request.user == folder.owner %}
            <img src="{% static 'media/img/pencil-svgrepo-com.svg' %}" alt="edit icon" title="Edit this link" id="editLink"  data-origin="card-icon">
            <img src="{% static 'media/img/trash-can-svgrepo-com.svg' %}" alt="delete icon" title="Delete this link" id="deleteLink">
        {% endif %}
    </div>
</div>
